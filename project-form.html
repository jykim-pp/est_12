<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="프로젝트 등록 및 기본 정보 수정">
    <title>프로젝트 등록 | 모두의 프로젝트 관리실</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/mock-data.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body data-page="project-form">
    <header class="app-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="대시보드 홈">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">모두의 프로젝트 관리실</span>
        </a>
        <div class="header-actions">
          <div class="user-chip" data-current-user></div>
          <a class="btn btn-secondary btn-small" href="index.html">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-label">목록으로</span>
          </a>
        </div>
      </div>
    </header>

    <main class="page-main">
      <div class="container">
        <nav class="breadcrumb" aria-label="현재 위치">
          <a href="index.html">프로젝트</a><span aria-hidden="true">/</span><span id="form-breadcrumb">등록</span>
        </nav>
        <section class="page-heading">
          <div>
            <p class="eyebrow">Project settings</p>
            <h1 id="form-page-title">새 프로젝트 등록</h1>
            <p class="lead">모든 프로젝트를 같은 기준으로 관리하는 데 필요한 기본 정보를 입력하세요.</p>
          </div>
        </section>

        <section class="panel">
          <div class="callout">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-width="1.8"/><path d="M12 11v5M12 8h.01" stroke-width="2" stroke-linecap="round"/></svg>
            <p>입력한 내용은 현재 브라우저 탭의 Mock Data에만 반영됩니다. 실제 데이터베이스에는 저장되지 않습니다.</p>
          </div>
          <form id="project-form">
            <div class="form-grid">
              <div class="field span-full">
                <label class="required" for="form-name">프로젝트명</label>
                <input class="input" id="form-name" type="text" maxlength="80" placeholder="프로젝트 이름을 입력하세요" required>
              </div>
              <div class="field">
                <label class="required" for="form-type">프로젝트 유형</label>
                <select class="select" id="form-type" required>
                  <option value="사업/용역 수행">사업/용역 수행</option>
                  <option value="서비스 개발">서비스 개발</option>
                  <option value="콘텐츠 제작">콘텐츠 제작</option>
                </select>
                <p class="field-help">선택한 유형에 맞는 세부 단계가 자동 적용됩니다.</p>
              </div>
              <div class="field">
                <label class="required" for="form-status">프로젝트 상태</label>
                <select class="select" id="form-status" required>
                  <option value="진행 중">진행 중</option>
                  <option value="완료">완료</option>
                </select>
              </div>
              <div class="field">
                <label class="required" for="form-planner">담당 기획자</label>
                <select class="select" id="form-planner" required></select>
              </div>
              <div class="field">
                <label class="required" for="form-responsible">담당자</label>
                <select class="select" id="form-responsible" required></select>
              </div>
              <div class="field">
                <label class="required" for="form-start-date">시작일</label>
                <input class="input" id="form-start-date" type="date" required>
              </div>
              <div class="field">
                <label class="required" for="form-end-date">종료 예정일</label>
                <input class="input" id="form-end-date" type="date" required>
              </div>
              <div class="field span-full">
                <label for="form-notion">노션 페이지 URL</label>
                <input class="input" id="form-notion" type="url" placeholder="https://www.notion.so/...">
                <p class="field-help">등록한 URL은 프로젝트 상세 화면에서 새 탭으로 열립니다.</p>
              </div>
              <div class="field span-full">
                <span class="field-label">적용될 세부 단계</span>
                <div class="chip-selector" id="type-stage-preview" aria-live="polite"></div>
              </div>
            </div>
            <div class="form-actions">
              <a class="btn btn-secondary" id="form-cancel" href="index.html">취소</a>
              <button class="btn btn-primary" type="submit">프로젝트 저장</button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
  </body>
</html>

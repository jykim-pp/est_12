<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="멀티 프로젝트 통합 대시보드 로그인">
    <title>로그인 | 모두의 프로젝트 관리실</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/mock-data.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body data-page="login">
    <main class="login-page">
      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-content">
          <a class="brand" href="index.html">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>모두의 프로젝트 관리실</span>
          </a>
          <p class="eyebrow">Welcome back</p>
          <h1 id="login-title">프로젝트의 오늘을<br>한눈에 확인하세요.</h1>
          <p>팀의 모든 프로젝트를 같은 기준으로 비교하고, 먼저 살펴볼 업무를 빠르게 발견할 수 있습니다.</p>
          <form class="login-form" id="login-form">
            <div class="field">
              <label class="required" for="login-email">이메일</label>
              <input class="input" id="login-email" name="email" type="email" value="seoyeon.park@example.com" autocomplete="email" required>
            </div>
            <div class="field">
              <label class="required" for="login-password">비밀번호</label>
              <input class="input" id="login-password" name="password" type="password" value="mock-password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary btn-block" type="submit">대시보드로 이동</button>
          </form>
          <p class="login-note">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-width="1.8"/><path d="M12 11v5M12 8h.01" stroke-width="2" stroke-linecap="round"/></svg>
            첫 번째 버전은 실제 인증을 사용하지 않습니다. 로그인 버튼은 개발 확인용으로 대시보드에 연결됩니다.
          </p>
        </div>
      </section>
      <aside class="login-visual" aria-hidden="true">
        <div class="visual-content">
          <span>ONE VIEW · CLEAR PRIORITY</span>
          <h2>흩어진 진행 정보를 모아<br>팀의 우선순위를 선명하게.</h2>
          <div class="preview-board">
            <img class="login-hero-image" src="assets/main_001.png" alt="" width="1376" height="768">
          </div>
        </div>
      </aside>
    </main>
  </body>
</html>

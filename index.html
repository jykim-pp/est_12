<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="여러 프로젝트의 진행 단계와 위험 상태를 한눈에 확인하는 통합 대시보드">
    <title>통합 프로젝트 대시보드!!</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/mock-data.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body data-page="dashboard">
    <header class="app-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="대시보드 홈">
          <img class="brand-logo" src="assets/퍼포먼스플러스 로고_아이콘.png" alt="" width="34" height="34">
          <span class="brand-name">모두의 프로젝트 관리실</span>
        </a>
        <nav class="header-actions" aria-label="주요 메뉴">
          <div class="user-chip" data-current-user></div>
          <a class="btn btn-ghost btn-small" href="user-projects.html">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Z" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-label">담당 프로젝트</span>
          </a>
          <a class="btn btn-ghost btn-small" href="users.html" data-admin-link>
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-label">사용자 관리</span>
          </a>
          <a class="btn btn-primary btn-small" href="project-form.html" data-project-manage-link>
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="nav-label">새 프로젝트</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="page-main">
      <div class="container">
        <section class="page-heading" aria-labelledby="dashboard-title">
          <div>
            <p class="eyebrow">Project overview</p>
            <h1 id="dashboard-title">통합 프로젝트 대시보드</h1>
            <p class="lead" id="scope-description">진행 중인 프로젝트의 핵심 현황과 먼저 확인할 업무를 살펴보세요.</p>
          </div>
          <a class="btn btn-secondary" href="login.html">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 18l6-6-6-6M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            로그인 화면
          </a>
        </section>

        <section class="overview-section" aria-labelledby="overview-section-title">
          <div class="overview-tabs" role="tablist" aria-label="프로젝트 현황 기준">
            <button class="overview-tab is-active" id="overview-section-title" type="button" role="tab" aria-selected="true" data-overview-tab="risk">위험 상태</button>
            <button class="overview-tab" type="button" role="tab" aria-selected="false" data-overview-tab="status">프로젝트 상태</button>
            <button class="overview-tab" type="button" role="tab" aria-selected="false" data-overview-tab="user">사용자</button>
          </div>
          <section class="summary-grid" id="summary-grid" aria-label="프로젝트 현황 요약" aria-live="polite"></section>
        </section>

        <section class="panel project-table-panel" aria-labelledby="project-table-title">
          <div class="panel-header project-table-header">
            <div>
              <p class="panel-kicker">PROJECT LIST</p>
              <h2 id="project-table-title">프로젝트 <span class="result-count" id="project-count">0</span></h2>
              <p class="section-description" id="filter-summary" aria-live="polite">전체 프로젝트를 표시하고 있습니다.</p>
            </div>
            <button class="btn btn-secondary btn-small" type="button" id="reset-table-filters">필터 초기화</button>
          </div>

          <div class="project-table-wrap">
            <table class="project-table">
              <thead>
                <tr>
                  <th>유형</th>
                  <th>프로젝트명</th>
                  <th>담당자</th>
                  <th>시작일</th>
                  <th>종료일</th>
                  <th>진행 단계</th>
                  <th><button class="table-sort-button" id="risk-sort-button" type="button" aria-pressed="false">위험 상태 <span aria-hidden="true">↕</span></button></th>
                  <th>예산</th>
                  <th>비고</th>
                </tr>
                <tr class="project-filter-row">
                  <th>
                    <select id="table-type-filter" aria-label="프로젝트 유형 필터">
                      <option value="all">전체</option>
                      <option value="사업/용역 수행">사업/용역</option>
                      <option value="서비스 개발">서비스</option>
                      <option value="콘텐츠 제작">콘텐츠</option>
                    </select>
                  </th>
                  <th>
                    <select id="table-status-filter" aria-label="프로젝트 상태 필터">
                      <option value="all">전체 상태</option>
                      <option value="검토">검토</option>
                      <option value="기획">기획</option>
                      <option value="진행 중">진행 중</option>
                      <option value="중단">중단</option>
                      <option value="완료">완료</option>
                    </select>
                  </th>
                  <th><select id="table-person-filter" aria-label="담당자 필터"><option value="all">전체</option></select></th>
                  <th><span class="table-filter-empty">—</span></th>
                  <th><span class="table-filter-empty">—</span></th>
                  <th>
                    <select id="table-stage-filter" aria-label="진행 단계 필터">
                      <option value="all">전체</option>
                      <option value="기획">기획</option>
                      <option value="준비">준비</option>
                      <option value="실행">실행</option>
                      <option value="검토">검토</option>
                      <option value="완료">완료</option>
                    </select>
                  </th>
                  <th>
                    <select id="table-risk-filter" aria-label="위험 상태 필터">
                      <option value="all">전체</option>
                      <option value="정상">정상</option>
                      <option value="확인 필요">확인 필요</option>
                      <option value="지연">지연</option>
                      <option value="즉시 점검 필요">즉시 점검</option>
                    </select>
                  </th>
                  <th><span class="table-filter-empty">—</span></th>
                  <th><span class="table-filter-empty">—</span></th>
                </tr>
              </thead>
              <tbody id="project-table-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
  </body>
</html>

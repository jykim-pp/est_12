<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="프로젝트 상세 현황 확인 및 업데이트">
    <title>프로젝트 상세 | 모두의 프로젝트 관리실</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/supabase-client.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/mock-data.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body data-page="detail">
    <header class="app-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="대시보드 홈">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">모두의 프로젝트 관리실</span>
        </a>
        <div class="header-actions">
          <div class="user-chip" data-current-user></div>
          <a class="btn btn-secondary btn-small" href="index.html">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-label">목록으로</span>
          </a>
          <button class="btn btn-secondary btn-small hidden" type="button" data-logout>
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 8V5H5v14h9v-3M10 12h11M18 9l3 3-3 3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-label">로그아웃</span>
          </button>
        </div>
      </div>
    </header>

    <main class="page-main">
      <div class="container" id="detail-root">
        <nav class="breadcrumb" aria-label="현재 위치">
          <a href="index.html">프로젝트</a><span aria-hidden="true">/</span><span id="breadcrumb-name">상세</span>
        </nav>

        <section class="detail-hero" id="detail-hero"></section>

        <div class="detail-layout">
          <div class="stack">
            <section class="panel" aria-labelledby="progress-title">
              <div class="panel-header">
                <div>
                  <p class="panel-kicker">PROGRESS</p>
                  <h2 id="progress-title">현재 진행 단계</h2>
                  <p class="section-description">상위 단계와 프로젝트 유형별 세부 단계를 선택하세요.</p>
                </div>
              </div>
              <div class="stage-selector" id="upper-stage-selector"></div>
              <div class="substage-area">
                <span class="field-label">세부 단계</span>
                <div class="chip-selector" id="detail-stage-selector"></div>
              </div>
            </section>

            <section class="panel" aria-labelledby="update-title">
              <div class="panel-header">
                <div>
                  <p class="panel-kicker">QUICK UPDATE</p>
                  <h2 id="update-title">프로젝트 현황 업데이트</h2>
                  <p class="section-description">팀이 바로 알아야 할 핵심 정보만 짧게 남겨주세요.</p>
                </div>
              </div>
              <div class="callout" id="permission-note"></div>
              <form id="update-form">
                <div class="form-grid">
                  <div class="field span-full">
                    <label class="required" for="project-summary">현재 단계 주요 공유사항</label>
                    <textarea class="textarea" id="project-summary" required maxlength="300"></textarea>
                  </div>
                  <div class="field">
                    <label class="required" for="project-issue">현재 이슈</label>
                    <textarea class="textarea" id="project-issue" required maxlength="300"></textarea>
                  </div>
                  <div class="field">
                    <label class="required" for="project-schedule">다음 일정</label>
                    <textarea class="textarea" id="project-schedule" required maxlength="200"></textarea>
                  </div>
                </div>
                <div class="form-actions">
                  <a class="btn btn-secondary" href="index.html">취소</a>
                  <button class="btn btn-primary" id="save-update" type="submit">현황 저장</button>
                </div>
              </form>
            </section>
          </div>

          <aside class="stack">
            <section class="panel" aria-labelledby="history-title">
              <div class="panel-header">
                <div>
                  <p class="panel-kicker">HISTORY</p>
                  <h2 id="history-title">최근 업데이트 기록</h2>
                </div>
              </div>
              <ol class="history-list" id="history-list"></ol>
            </section>

            <section class="panel" aria-labelledby="notion-title">
              <div class="panel-header">
                <div>
                  <p class="panel-kicker">DOCUMENTS</p>
                  <h2 id="notion-title">연결된 자료</h2>
                </div>
              </div>
              <div id="notion-link-area"></div>
            </section>
          </aside>
        </div>
      </div>
    </main>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
  </body>
</html>
